name: ci

on:
  push:
    branches: [develop, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint TypeScript and Astro
        run: npm run lint

      - name: Lint styles
        run: npm run lint:css

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build (test shape, base /)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        timeout-minutes: 10
        run: npm run test:e2e

      - name: Lighthouse budgets
        timeout-minutes: 8
        run: npm run lhci

      - name: Build and verify the production shape (base /resume/)
        run: npm run check:pages

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7
