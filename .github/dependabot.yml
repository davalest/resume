version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      linting:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "stylelint*", "prettier*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "@axe-core/*", "@lhci/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
